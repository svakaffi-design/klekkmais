<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simon – 6. trinn</title>
    <style>
      :root { --ink:#17324d; --blue:#246bce; --paper:#f7fbff; }
      * { box-sizing:border-box; }
      body { min-height:100vh; margin:0; display:grid; place-items:center; padding:1.5rem; font-family:ui-rounded,"Avenir Next",Avenir,"Segoe UI",sans-serif; color:var(--ink); background:linear-gradient(145deg,#e8f5ff,var(--paper)); }
      main { width:min(500px,100%); text-align:center; }
      a { color:var(--blue); font-weight:700; }
      h1 { margin:.7rem 0 .25rem; font-size:clamp(2rem,8vw,3rem); letter-spacing:-.04em; }
      p { margin:.25rem auto 1.2rem; line-height:1.5; }
      .board { width:min(390px,85vw); aspect-ratio:1; display:grid; grid-template-columns:1fr 1fr; gap:13px; padding:13px; margin:1.2rem auto; background:#183854; border:8px solid #183854; border-radius:50%; box-shadow:0 13px 28px #18385442; }
      .pad { border:0; cursor:pointer; opacity:.78; transition:opacity .1s, transform .1s, filter .1s; }
      .pad:hover { opacity:1; }
      .pad:active { transform:scale(.96); }
      .pad.active { opacity:1; filter:brightness(1.5); transform:scale(.98); box-shadow:0 0 23px 8px #fff; }
      #green { background:#32b86b; border-radius:100% 12% 12% 12%; }
      #red { background:#eb5a55; border-radius:12% 100% 12% 12%; }
      #yellow { background:#f5c642; border-radius:12% 12% 12% 100%; }
      #blue { background:#3a82d7; border-radius:12% 12% 100% 12%; }
      #start { border:0; border-radius:99px; padding:.8rem 1.45rem; background:var(--blue); color:white; font:inherit; font-weight:800; cursor:pointer; box-shadow:0 5px 12px #246bce40; }
      #start:hover { background:#1758af; }
      #status { min-height:1.5rem; font-weight:750; }
      .score { display:inline-block; margin:0 .18rem .5rem; padding:.3rem .75rem; border-radius:99px; background:white; font-weight:800; }
    </style>
  </head>
  <body>
    <main>
      <a href="index.html">← Tilbake til 6. trinn</a>
      <h1>Simon</h1>
      <p>Se rekkefølgen, og trykk på fargene i samme rekkefølge.</p>
      <div><span class="score">Runde <span id="round">0</span></span><span class="score">Poeng <span id="points">0</span></span></div>
      <div class="board" aria-label="Simon-spill">
        <button class="pad" id="green" aria-label="Grønn"></button><button class="pad" id="red" aria-label="Rød"></button>
        <button class="pad" id="yellow" aria-label="Gul"></button><button class="pad" id="blue" aria-label="Blå"></button>
      </div>
      <p id="status" aria-live="polite">Trykk start når du er klar.</p>
      <button id="start">Start spill</button>
    </main>
    <script>
      const colors = ['green', 'red', 'yellow', 'blue'];
      const pads = Object.fromEntries(colors.map(color => [color, document.querySelector('#' + color)]));
      const status = document.querySelector('#status');
      const round = document.querySelector('#round');
      const points = document.querySelector('#points');
      const start = document.querySelector('#start');
      let sequence = [], answer = [], playing = false;
      let score = 0;
      let audio;

      const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
      const notes = { green: 261.63, red: 329.63, yellow: 392, blue: 523.25 };
      function playTone(color, length = .22) {
        audio ??= new AudioContext();
        const oscillator = audio.createOscillator(), gain = audio.createGain();
        oscillator.frequency.value = notes[color]; oscillator.type = 'sine';
        gain.gain.setValueAtTime(.0001, audio.currentTime); gain.gain.exponentialRampToValueAtTime(.12, audio.currentTime + .015);
        gain.gain.exponentialRampToValueAtTime(.0001, audio.currentTime + length);
        oscillator.connect(gain).connect(audio.destination); oscillator.start(); oscillator.stop(audio.currentTime + length + .02);
      }
      function flash(color) { pads[color].classList.add('active'); playTone(color); setTimeout(() => pads[color].classList.remove('active'), 360); }
      async function showSequence() {
        playing = false; status.textContent = 'Følg godt med …';
        await wait(500);
        for (const color of sequence) { flash(color); await wait(650); }
        answer = []; playing = true; status.textContent = 'Din tur!';
      }
      async function nextRound() {
        const color = colors[Math.floor(Math.random() * colors.length)];
        // Etter de første fire stegene blir mønsteret av og til vanskeligere:
        // den samme tonen kan da komme to eller tre ganger på rad.
        const repeats = sequence.length >= 4 && Math.random() < .4 ? 2 + Math.floor(Math.random() * 2) : 1;
        sequence.push(...Array(repeats).fill(color));
        round.textContent = sequence.length;
        await showSequence();
      }
      async function begin() { sequence = []; score = 0; round.textContent = '0'; points.textContent = '0'; start.disabled = true; start.textContent = 'Spiller …'; await nextRound(); }
      start.addEventListener('click', begin);
      colors.forEach(color => pads[color].addEventListener('click', async () => {
        if (!playing) return;
        flash(color); answer.push(color);
        const position = answer.length - 1;
        if (answer[position] !== sequence[position]) {
          playing = false; status.textContent = `Nesten! Du kom til runde ${sequence.length}.`;
          start.disabled = false; start.textContent = 'Prøv igjen'; return;
        }
        if (answer.length === sequence.length) { playing = false; score += sequence.length * 10; points.textContent = score; status.textContent = 'Riktig! Neste runde …'; await wait(900); nextRound(); }
      }));
    </script>
  </body>
</html>
