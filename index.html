
<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">

  <title>KLEKKMAIS</title>

  <meta name="description"
        content="Seks små spill og kreative eksperimenter. Test hodet, hånden og tålmodigheten.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    #home {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 32px 24px;
    }

    main {
      width: min(100%, 320px);
    }

    h1 {
      text-align: center;
      font-size: 26px;
      font-weight: 500;
      letter-spacing: .16em;
      margin: 0 0 32px;
    }

    ul {
      margin: 0;
      padding-left: 22px;
    }

    li {
      padding-left: 6px;
      margin: 15px 0;
    }

    a {
      color: #eee;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 16px;
      min-height: 38px;
      font-size: 16px;
    }

    .icon {
      width: 34px;
      height: 34px;
      flex-shrink: 0;
      fill: none;
      stroke: var(--accent);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .player {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: #000;
      display: flex;
      flex-direction: column;
    }

    .player[hidden] {
      display: none;
    }

    .player-bar {
      height: 54px;
      display: flex;
      align-items: center;
      padding: 0 16px;
    }

    .back {
      background: none;
      border: 0;
      color: #fff;
      font-size: 26px;
      cursor: pointer;
    }

    .player iframe {
      display: block;
      border: 0;
      width: 100%;
      flex: 1;
      min-height: 0;
      background: #000;
    }
  </style>
</head>

<body>
  <div id="home">
    <main>
      <h1>KLEKKMAIS</h1>

      <ul>
        <!-- Fyrstikk IQ -->
        <!-- Ikke kryss streken -->
        <!-- Ordfragmenter -->
        <!-- Tegn en sirkel -->
        <!-- Tegn et kvadrat -->
        <!-- Stjernebilder -->
      </ul>
    </main>
  </div>

  <section class="player"
           id="player"
           aria-label="Prosjekt"
           hidden>

    <div class="player-bar">
      <button class="back" id="back">←</button>
      <span id="player-name"></span>
    </div>

    <iframe id="frame"
            title="Valgt prosjekt"
            sandbox="allow-scripts allow-same-origin">
    </iframe>
  </section>

  <script>
    // De seks spillenes kildekode ligger her
    // i originalfilen, kodet som Base64.

    const names = [
      "Fyrstikk IQ",
      "Ikke kryss streken",
      "Ordfragmenter",
      "Tegn en sirkel",
      "Tegn et kvadrat",
      "Stjernebilder"
    ];

    // Spillene åpnes i en iframe.
  </script>
</body>
</html>
