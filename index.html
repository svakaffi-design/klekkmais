<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUSEFLUKT</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background:#111;
  color:white;
  font-family:Arial,sans-serif;
}

#ui{
  position:fixed;
  top:10px;
  left:10px;
  z-index:10;
}

#scoreboard{
  margin-top:10px;
  font-size:14px;
}

canvas{display:block;}

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.9);
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  text-align:center;
  padding:40px;
}

#levelMessage{
  position:fixed;
  top:40%;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:48px;
  font-weight:bold;
  opacity:0;
  transition:opacity 0.5s;
  pointer-events:none;
}

input,button{
  padding:8px;
  margin:6px;
  font-size:16px;
}
</style>
</head>
<body>

<div id="ui">
  Tid: <span id="time">0.0</span>
  <div id="scoreboard"></div>
</div>

<div id="levelMessage"></div>

<div id="startScreen" class="overlay">
  <h1>MUSEFLUKT</h1>
  <p>
  I dette spillet skal du dodge alle figurene så lenge du klarer.<br>
  Det blir vanskeligere hvert 10. sekund.<br><br>
  Lykke til!
  </p>
  <button onclick="start()">Start spill</button>
</div>

<canvas id="game"></canvas>

<div id="gameOver" class="overlay" style="display:none;">
  <h2>Game Over</h2>
  Din tid: <span id="finalTime"></span>
  <input id="nameInput" placeholder="Navn">
  <button onclick="saveScore()">Lagre</button>
  <button onclick="restart()">Spill igjen</button>
</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAhhykV2g7Zefc3put128PO0b341LA5dog",
    authDomain: "museflukt.firebaseapp.com",
    projectId: "museflukt",
    storageBucket: "museflukt.firebasestorage.app",
    messagingSenderId: "395858262096",
    appId: "1:395858262096:web:d021672f7628bf14e1f955"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // Expose db functions to global scope so non-module scripts can use them
  window.firebaseDB = db;
  window.firebaseAddDoc = addDoc;
  window.firebaseCollection = collection;
  window.firebaseGetDocs = getDocs;
  window.firebaseQuery = query;
  window.firebaseOrderBy = orderBy;
  window.firebaseLimit = limit;

  // Load scores on startup
  window.addEventListener("load", () => {
    displayScores();
  });
</script>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

function resize(){
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

let shapes=[];
let mouse={x:0,y:0};
let startTime;
let gameRunning=false;
let lastSpawn=0;
let spawnDelay=900;
let level=1;
let currentLevelShown=1;

document.addEventListener("mousemove",e=>{
  mouse.x=e.clientX;
  mouse.y=e.clientY;
});
document.addEventListener("mouseleave",()=>endGame());

class Shape{
  constructor(){
    this.size=20+Math.random()*60;
    this.speed=(1+Math.random()*2) * (1 + level*0.35);
    this.type=Math.floor(Math.random()*3);

    let edge=Math.floor(Math.random()*4);
    if(edge===0){this.x=0;this.y=Math.random()*canvas.height;this.vx=this.speed;this.vy=(Math.random()-0.5)*3;}
    if(edge===1){this.x=canvas.width;this.y=Math.random()*canvas.height;this.vx=-this.speed;this.vy=(Math.random()-0.5)*3;}
    if(edge===2){this.x=Math.random()*canvas.width;this.y=0;this.vx=(Math.random()-0.5)*3;this.vy=this.speed;}
    if(edge===3){this.x=Math.random()*canvas.width;this.y=canvas.height;this.vx=(Math.random()-0.5)*3;this.vy=-this.speed;}

    if(this.type===2){
      this.sides=7+Math.floor(Math.random()*3);
    }
  }

  update(){
    this.x+=this.vx;
    this.y+=this.vy;
  }

  draw(){
    ctx.beginPath();

    if(this.type===0){
      ctx.fillStyle="blue";
      ctx.rect(this.x,this.y,this.size,this.size*0.6);
    }

    if(this.type===1){
      ctx.fillStyle="yellow";
      ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
    }

    if(this.type===2){
      ctx.fillStyle="red";
      for(let i=0;i<this.sides;i++){
        let angle=(i/this.sides)*Math.PI*2;
        let px=this.x+Math.cos(angle)*this.size;
        let py=this.y+Math.sin(angle)*this.size;
        if(i===0) ctx.moveTo(px,py);
        else ctx.lineTo(px,py);
      }
      ctx.closePath();
    }

    ctx.fill();
  }

  collide(){
    if(this.type===0){
      // Rektangel: sjekk om musen er innenfor rektangelets faktiske grenser
      return mouse.x > this.x && mouse.x < this.x + this.size &&
             mouse.y > this.y && mouse.y < this.y + this.size * 0.6;
    }
    // Sirkel og polygon: avstandssjekk fra sentrum
    let dx=mouse.x-this.x;
    let dy=mouse.y-this.y;
    return Math.sqrt(dx*dx+dy*dy)<this.size;
  }
}

function spawn(){
  shapes.push(new Shape());
}

function showLevelMessage(lvl){
  const msg=document.getElementById("levelMessage");
  msg.textContent="LEVEL " + lvl;
  msg.style.opacity=1;
  setTimeout(()=>msg.style.opacity=0,1500);
}

function loop(timestamp){
  if(!gameRunning)return;

  ctx.fillStyle="#111";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  let elapsed=(Date.now()-startTime)/1000;

  level=Math.floor(elapsed/10)+1;
  if(level>currentLevelShown){
    currentLevelShown=level;
    showLevelMessage(level);
    spawnDelay*=0.65;
  }

  if(timestamp-lastSpawn>spawnDelay){
    spawn();
    lastSpawn=timestamp;
  }

  shapes.forEach(s=>{
    s.update();
    s.draw();
    if(s.collide())endGame();
  });

  document.getElementById("time").textContent=elapsed.toFixed(1);

  requestAnimationFrame(loop);
}

function start(){
  document.getElementById("startScreen").style.display="none";
  shapes=[];
  startTime=Date.now();
  spawnDelay=900;
  level=1;
  currentLevelShown=1;
  gameRunning=true;
  requestAnimationFrame(loop);
}

function endGame(){
  if(!gameRunning)return;
  gameRunning=false;
  let time=(Date.now()-startTime)/1000;
  document.getElementById("finalTime").textContent=time.toFixed(1);
  document.getElementById("gameOver").style.display="flex";
}

function restart(){
  location.reload();
}

async function saveScore(){
  let name=document.getElementById("nameInput").value||"Anonym";
  let time=parseFloat(document.getElementById("finalTime").textContent);

  try {
    const db = window.firebaseDB;
    const addDoc = window.firebaseAddDoc;
    const collection = window.firebaseCollection;

    if(db && addDoc && collection){
      await addDoc(collection(db, "scores"), {
        name: name,
        time: time,
        timestamp: Date.now()
      });
      console.log("Score lagret i Firebase!");
    } else {
      // Fallback til localStorage om Firebase ikke er klar
      let scores=JSON.parse(localStorage.getItem("scores")||"[]");
      scores.push({name,time});
      scores.sort((a,b)=>b.time-a.time);
      scores=scores.slice(0,10);
      localStorage.setItem("scores",JSON.stringify(scores));
    }
  } catch(err) {
    console.error("Feil ved lagring:", err);
    // Fallback til localStorage
    let scores=JSON.parse(localStorage.getItem("scores")||"[]");
    scores.push({name,time});
    scores.sort((a,b)=>b.time-a.time);
    scores=scores.slice(0,10);
    localStorage.setItem("scores",JSON.stringify(scores));
  }

  restart();
}

async function displayScores(){
  const scoreboard = document.getElementById("scoreboard");

  try {
    const db = window.firebaseDB;
    const getDocs = window.firebaseGetDocs;
    const collection = window.firebaseCollection;
    const q_fn = window.firebaseQuery;
    const orderBy = window.firebaseOrderBy;
    const limit = window.firebaseLimit;

    if(db && getDocs && collection){
      const q = q_fn(collection(db, "scores"), orderBy("time", "desc"), limit(10));
      const snapshot = await getDocs(q);
      let html="<h3>Topp 10</h3>";
      let i=1;
      snapshot.forEach(doc => {
        const s = doc.data();
        html+=`${i}. ${s.name} - ${s.time}s<br>`;
        i++;
      });
      scoreboard.innerHTML=html;
      return;
    }
  } catch(err) {
    console.error("Feil ved henting av scores:", err);
  }

  // Fallback til localStorage
  let scores=JSON.parse(localStorage.getItem("scores")||"[]");
  let html="<h3>Topp 10</h3>";
  scores.forEach((s,i)=>{
    html+=`${i+1}. ${s.name} - ${s.time}s<br>`;
  });
  scoreboard.innerHTML=html;
}

// Initial load av scores (også kalt fra Firebase module når klar)
displayScores();
</script>

</body>
</html>
